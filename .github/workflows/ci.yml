name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, nstut-vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest -q
      - run: python -m compileall -q src
      - name: Verify addon entry point
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points
          eps = entry_points().select(group='discord_adapter.addons')
          assert any(ep.name == 'quiz' for ep in eps)
          PY
